# 实体归一化规则：mappings 为精确映射（原名 → 标准名），patterns 为正则替换，按顺序执行
mappings: {}
patterns:
  - regex: "^[“\"《]+|[”\"》]+$"   # 去掉首尾引号/书名号
    replace: ""
# 关系同义写法 → 白名单标准关系（子串匹配，按白名单顺序优先）
relation_aliases:
  属于: [隶属于, 隶属, 是]
  位于: [坐落于, 地处]
  任职于: [担任, 就职于]
  发布: [公布, 推出, 印发]
  举办: [举行, 召开, 主办]
  参与: [参加, 出席]
  发生于: [发生在, 发生]
  导致: [造成, 引发, 致使]
  影响: [冲击, 波及]
  包含: [包括]
  合作: [携手, 联合]
  签署: [签订, 签约]
  获得: [获, 荣获, 取得]
fallback_relation: 相关

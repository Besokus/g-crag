# 由原 kg_normalize.py 抽取：编号前缀剥离（#1主变 / 1号主变 / 一、主变 → 主变）+ 关系同义写法
mappings: {}
patterns:
  - regex: "^[#＃]?\\d+\\s*号?"
    replace: ""
  - regex: "^[一二三四五六七八九十0-9]+[、.\\s]+"
    replace: ""
relation_aliases:
  发生: [出现, 产生]
  表现为: [症状, 现象是]
  处置方法: [处理方法, 处置, 处理, 应对, 消除]
  检修步骤: [检修, 维修, 检修方法, 处理步骤]
  原因: [因为, 导致, 引发, 由]
  影响: [波及, 后果, 危害]
  预防: [预防措施, 防范, 防止]
  属于: [归属, 是]
  位于: [安装在, 位置, 装设]
  额定值: [额定, 参数, 容量]
  预警阈值: [阈值, 报警值, 限值, 告警]
  保护: [保护范围, 动作于, 跳闸]
  试验: [检验, 测试, 校验]
fallback_relation: 相关

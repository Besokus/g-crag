# G-CRAG 全栈编排（fork 自 zhyese/grid-qa，裁剪为 9 个服务，见 docs/adr/0003）
# mysql + minio | etcd + milvus-minio + milvus | redis + neo4j | backend + frontend
# 一键启动: docker compose -p gcrag-general up -d --build

services:
  # ---------- MySQL：结构化元数据 ----------
  mysql:
    image: mysql:8.0
    container_name: grid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-grid_qa}
      MYSQL_USER: ${MYSQL_USER:-grid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-grid123456}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"   # 宿主机 3307，避开本机 MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- MinIO：源文档对象存储 ----------
  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372   # pin-digest；官方 minio/minio 已停止在 Docker Hub 发布，改用 Pigsty 维护的兼容分支
    container_name: grid-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------- etcd：Milvus 元数据依赖 ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: grid-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------- Milvus 专用对象存储 ----------
  milvus-minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372   # pin-digest；官方 minio/minio 已停止在 Docker Hub 发布，改用 Pigsty 维护的兼容分支
    container_name: grid-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/milvus-minio:/minio_data
    command: minio server /minio_data

  # ---------- Milvus 2.4 向量库 ----------
  milvus:
    image: milvusdb/milvus:v2.4.10
    container_name: grid-milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    # 2026-09-07：MinIO 磁盘水位触底 → datanode 写入 panic → 崩溃循环 52 次，
    # WSL crash dump 每次抓 3-4GB（共 28.4GB）把宿主 C 盘塞满。加内存上限防失控。
    mem_limit: 6g
    depends_on:
      - etcd
      - milvus-minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ---------- Redis：热点问答缓存 ----------
  redis:
    image: redis:7-alpine
    container_name: grid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --maxmemory 300mb --maxmemory-policy noeviction --maxmemory-samples 10 --requirepass grid-langfuse-pass
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Neo4j：知识图谱（设备-故障-处置 多跳推理）----------
  neo4j:
    image: neo4j@sha256:4bae36aff76271e27fd6a6ed0835413f86a284cd179cfb1cb7d188f5f7533aca   # pin-digest（原 neo4j:5-community）
    container_name: grid-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j123456}
      # 2026-09-07：宿主机异常断电致事务日志尾部损坏（checkpoint 指向无效位置，恢复失败循环重启）。
      # 允许截断损坏尾部抢救启动（KG 三元组在 MySQL KgTriple 有镜像，可重建，风险可控）。
      # 注① internal.* 为未声明内部项，5.x 默认 strict_validation 会拒启；显式放宽校验。
      # 注② docker env 转义规则：_ → . ，__ → _。目标 fail_on_corrupted_log_files（下划线）
      #    必须写 fail__on__corrupted__log__files；写成 fail_on 会被转成 fail.on（不识别）。
      # 注③ 断电后 tx log 文件整体缺失（MissingTransactionLogsCheck 拒启）→ 放行缺失检查
      #    （官方口径 db.recovery.fail_on_missing_files=false，官方 KB 18000369252115；
      #     dbms.recovery.* 为旧名，5.26 识别但报 deprecated）。
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_internal_dbms_tx__log_fail__on__corrupted__log__files: "false"
      NEO4J_db_recovery_fail__on__missing__files: "false"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser（宿主端口可在 .env 覆盖，避免与其他本地 Neo4j 冲突）
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt 协议
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      # 7474 HTTP 就绪即 Bolt 可用（镜像内无 curl，有 wget）
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------- 后端 ----------
  backend:
    build:
      context: ./backend
      args:
        - HTTP_PROXY=${BUILD_PROXY:-}   # 默认直连（apt/pip 走阿里云镜像）；需代理时在 .env 设 BUILD_PROXY
        - HTTPS_PROXY=${BUILD_PROXY:-}
        - BGE_PRELOAD=false
    container_name: grid-backend
    restart: unless-stopped
    env_file: .env                     # API keys / 开关注入（environment 块优先级更高，覆盖连接串等）
    depends_on:
      # 强依赖：必须健康才起后端（防"依赖崩溃循环、后端照常启动、功能静默降级"）
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      # 容器内用 service name + 内部端口连接（覆盖 .env 的 localhost）
      DATABASE_URL: mysql+aiomysql://grid:grid123456@mysql:3306/grid_qa?charset=utf8mb4
      REDIS_URL: redis://:grid-langfuse-pass@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MILVUS_HOST: milvus
      NEO4J_URI: bolt://neo4j:7687
      # G-CRAG：langfuse / mock-scada / 工单与主动运维已裁剪（ADR 0003），不再注入 OTLP、MCP 与业务闭环开关
      MCP_SERVERS: '[]'
      MCP_EXTERNAL_ENABLED: "false"
      # 链路节点详情（瀑布图 attrs：参数/prompt 采集；关=现状只记耗时；纯观测不进缓存版本）
      QA_TRACE_DETAIL_ENABLE: "true"
      # 容器直连外网：云API(dashscope/deepseek/doubao 国内可达) + bge 走 hf-mirror 国内镜像。
      # 注：宿主机代理 7897 仅监听 127.0.0.1（未开 Allow LAN），容器经 host.docker.internal 连不上，
      # 故不设 HTTPS_PROXY——否则 httpx/requests 把所有出站（含 hf-mirror、云API）都发往不可达代理。
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_OFFLINE: "1"            # 离线模式：用挂载的宿主机 HF 缓存，避免联网下载受阻
      TRANSFORMERS_OFFLINE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - grid-backend-data:/app/data   # 持久化 data/（运行日志 + 数据备份 .sql），容器重建不丢
      - ./scripts:/app/scripts:ro     # eval_matrix API 触发的 CLI 工具（只读；工具目录非源码热载）
      - ./reports:/app/reports        # 评测矩阵报告落宿主 reports/（系统管理-评测矩阵可浏览）
      - ./data/crud_rag:/app/crud_rag:ro     # G-CRAG 评测原始数据（CRUD-RAG，不入库，ADR 0007）
      - ./data/gcrag_eval:/app/gcrag_eval    # 评测集构建产物与运行结果（scripts/gcrag_eval.py）
      - ${HF_CACHE_DIR:-./data/hf-cache}:/root/.cache/huggingface/hub:ro   # 宿主机 bge 缓存（离线加载）；G-CRAG 只用云端 embedding，默认挂空目录

  # ---------- 前端（nginx）----------
  frontend:
    build:
      context: ./frontend
      args:
        - HTTP_PROXY=${BUILD_PROXY:-}   # 默认直连（apt/pip 走阿里云镜像）；需代理时在 .env 设 BUILD_PROXY
        - HTTPS_PROXY=${BUILD_PROXY:-}
    container_name: grid-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
  grid-backend-data:


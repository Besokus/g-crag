server {
    listen 80;
    server_name _;

    # 反向代理 API 到后端容器
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100m;   # 文档上传上限
        proxy_read_timeout 120s;     # LLM 问答可能较慢
    }

    # SSE 流式问答专用：关缓冲 + HTTP/1.1 长连接，防 nginx 攒 buffer 致浏览器 502
    location /api/qa/answer/stream {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";        # 关 keepalive 复用，保 SSE 长连接
        proxy_buffering off;                    # 关键：token 不攒 buffer，实时转发
        proxy_cache off;
        proxy_read_timeout 600s;                # fallback 链全走（含 ollama CPU 推理）可能较久
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 前端单页应用
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

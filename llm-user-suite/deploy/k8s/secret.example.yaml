apiVersion: v1
kind: Secret
metadata:
  name: llm-user-suite-env
type: Opaque
stringData:
  LLM_USER_DATABASE_URL: postgresql+asyncpg://llm_user:REPLACE_ME@llm-user-postgres:5432/llm_user
  LLM_USER_USER_HASH_SECRET: REPLACE_ME
  LLM_USER_GRID_CALLBACK_SECRET: REPLACE_ME
  LLM_USER_GRID_EVENT_SECRET: REPLACE_ME
  LLM_USER_GRID_CALLBACK_URL: http://grid-qa-test.REPLACE_GRID_QA_NAMESPACE.svc:18500/api/integrations/llm-user/evaluations
  LLM_USER_GRID_AUTH_BASE_URL: http://grid-qa-test.REPLACE_GRID_QA_NAMESPACE.svc:18500
  LLM_USER_TARGET_BASE_URL: http://grid-qa-test.REPLACE_GRID_QA_NAMESPACE.svc:18500
  LLM_USER_ALLOWED_TARGET_HOSTS: grid-qa-test.REPLACE_GRID_QA_NAMESPACE.svc
  LLM_USER_TARGET_ENVIRONMENT: test
  LLM_USER_CREDENTIAL_PROFILES_JSON: '{"default":{"username":"REPLACE_ME","password":"REPLACE_ME"}}'
  LLM_USER_S3_ACCESS_KEY: REPLACE_ME
  LLM_USER_S3_SECRET_KEY: REPLACE_ME
  LLM_USER_DREAMER_BASE_URL: https://REPLACE_ME/v1
  LLM_USER_DREAMER_API_KEY: REPLACE_ME
  LLM_USER_DREAMER_MODEL: REPLACE_ME
  LLM_USER_ACTOR_BASE_URL: https://REPLACE_ME/v1
  LLM_USER_ACTOR_API_KEY: REPLACE_ME
  LLM_USER_ACTOR_MODEL: REPLACE_ME
  LLM_USER_JUDGE_BASE_URL: https://REPLACE_ME/v1
  LLM_USER_JUDGE_API_KEY: REPLACE_ME
  LLM_USER_JUDGE_MODEL: REPLACE_ME
  LLM_USER_CHALLENGER_BASE_URL: https://REPLACE_ME/v1
  LLM_USER_CHALLENGER_API_KEY: REPLACE_ME
  LLM_USER_CHALLENGER_MODEL: REPLACE_ME
  LLM_USER_OLLAMA_BASE_URL: http://REPLACE_OLLAMA_SERVICE:11434/v1
  LLM_USER_OLLAMA_MODEL: qwen2.5:1.5b-instruct-q4_K_M
  # 仅在显式开启授权原文采集时配置。生产要求 KMS 包装每个随机数据密钥。
  LLM_USER_RAW_CAPTURE_KEY_ID: REPLACE_ME
  LLM_USER_RAW_CAPTURE_KMS_URL: https://REPLACE_ME/v1/encrypt
  LLM_USER_RAW_CAPTURE_KMS_TOKEN: REPLACE_ME
  # 仅本地开发且显式关闭 RAW_CAPTURE_REQUIRE_KMS 时可使用 32 字节 URL-safe base64 KEK。
  LLM_USER_RAW_CAPTURE_KEY: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  MINIO_ROOT_USER: REPLACE_ME
  MINIO_ROOT_PASSWORD: REPLACE_ME

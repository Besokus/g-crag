apiVersion: apps/v1
kind: Deployment
metadata: {name: llm-user-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: llm-user-api}}
  template:
    metadata: {labels: {app: llm-user-api}}
    spec:
      serviceAccountName: llm-user-controller
      containers:
        - name: api
          image: grid-qa-llm-user:dev
          envFrom: [{configMapRef: {name: llm-user-suite-config}}, {secretRef: {name: llm-user-suite-env}}]
          env:
            - {name: LLM_USER_ROLE, value: api}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /health, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 15, failureThreshold: 3}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: llm-user-api}
spec: {selector: {app: llm-user-api}, ports: [{name: http, port: 8080, targetPort: http}]}
---
